[build]
  command = "npm run build"
  publish = "dist"

[build.processing.html]
  pretty_urls = true

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/cases.html"
  to = "/cases"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

