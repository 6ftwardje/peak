# Netlify configuration for the static site + intake function.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Friendly path: /api/intake → the function (the front-end calls /.netlify/functions/intake,
# but this alias keeps the URL clean if you ever want to call /api/intake directly).
[[redirects]]
  from = "/api/intake"
  to = "/.netlify/functions/intake"
  status = 200

# /nl is enkel een korte deelbare URL en stuurt door naar de echte pagina. Bewust een
# 301 en geen rewrite: zo bestaat de Nederlandse pagina op precies een adres, wat
# overeenkomt met de hreflang-tags in beide heads. De links in de nav wijzen
# rechtstreeks naar index-nl.html, zodat de taalwissel ook lokaal werkt.
[[redirects]]
  from = "/nl"
  to = "/index-nl.html"
  status = 301

[[redirects]]
  from = "/nl/"
  to = "/index-nl.html"
  status = 301
